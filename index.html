<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Bakery | جراند بيكري</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg); color: white; overflow-x: hidden; padding-bottom: 120px; }
        
        /* Video Background - Reduced blur for clarity */
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(2px) brightness(35%); z-index: -1; }
        
        .top-bar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1200px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; z-index: 1000; border-radius: 0 0 20px 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.5); box-sizing: border-box; }
        .top-bar img { height: 50px; }
        
        /* PWA Notification */
        #install-notif { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--gold); color: black; padding: 18px; border-radius: 20px; display: none; flex-direction: column; gap: 12px; z-index: 2000; width: 290px; text-align: center; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #install-notif button { background: black; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; }

        .container { margin-top: 120px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .top-menu-card { width: 320px; border-radius: 25px; overflow: hidden; cursor: pointer; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); display: flex; flex-direction: column; align-items: center; padding: 12px; transition: 0.3s; }
        .top-menu-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 18px; }
        .top-menu-card h2 { margin: 12px 0; font-size: 1.5rem; color: var(--gold); }
        
        .submenu { display: none; max-width: 650px; width: 92%; margin: 10px auto; padding: 15px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .thumb { width: 65px; height: 65px; border-radius: 12px; object-fit: cover; border: 1px solid var(--gold); }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: rgba(212, 175, 55, 0.2); border: 1px solid var(--gold); color: white; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; }

        #cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #25D366; color: white; padding: 18px; display: none; justify-content: space-around; align-items: center; z-index: 2001; font-weight: bold; cursor: pointer; }

        /* Contact Details */
        .contact-section { text-align: center; padding: 40px 0; margin-top: 50px; border-top: 1px solid rgba(212, 175, 55, 0.3); background: rgba(0,0,0,0.4); }
        .contact-phones a { color: white; text-decoration: none; font-size: 1.2rem; border: 1px solid var(--gold); padding: 8px 20px; border-radius: 12px; display: inline-block; background: rgba(212, 175, 55, 0.1); margin: 5px; font-family: sans-serif; }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .social-icons img { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--gold); object-fit: cover; }

        /* Name & Choice Modals */
        .order-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; justify-content:center; align-items:center; }
        .modal-card { background: #111; padding: 30px; border-radius: 25px; border: 1px solid var(--gold); text-align: center; width: 90%; max-width: 400px; }
        .modal-btn { display:block; text-decoration:none; padding:15px; margin: 10px 0; border-radius:12px; font-weight:bold; font-size: 1.1rem; border:none; width:100%; cursor:pointer; }
        .admin-input { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; }

        /* Admin Layout */
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .btn-gold { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;}
        .del-btn { background: #ff4444; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="install-notif">
        <span>تثبيت الموقع على الشاشة الرئيسية</span>
        <button onclick="installApp()">تثبيت الآن</button>
        <button onclick="closeNotif()" style="background:none; color:black; font-size: 0.8rem;">إغلاق</button>
    </div>

    <video autoplay muted loop playsinline><source src="grandvideo.mp4" type="video/mp4"></video>

    <div class="top-bar">
        <img src="logogrand.png" alt="Grand Bakery">
        <button onclick="toggleAdminModal()" style="background:none; border:none; font-size: 22px; cursor: pointer;">⚙️</button>
    </div>

    <div class="container" id="category-list"></div>

    <div class="contact-section">
        <h2 style="color:var(--gold);">تواصل معنا</h2>
        <div class="contact-phones">
            <a href="tel:0797475002">0797475002</a>
            <a href="tel:0792089999">0792089999</a>
        </div>
        <div class="social-icons">
            <a href="https://www.instagram.com/grandbakeryjo" target="_blank"><img src="Instagram.jpg" alt="Instagram"></a>
            <a href="https://maps.app.goo.gl/YourLink" target="_blank"><img src="googlemapsembed.jpg" alt="Google Maps"></a>
        </div>
    </div>

    <div id="cart-bar" onclick="showNameModal()">
        <span>إرسال الطلب عبر الواتساب</span>
        <span id="cart-total">0.00 JD</span>
    </div>

    <div id="nameModal" class="order-modal">
        <div class="modal-card">
            <h3 style="color:var(--gold);">الرجاء إدخال الاسم للطلب</h3>
            <input type="text" id="custName" class="admin-input" placeholder="الاسم الكامل" style="text-align:center;">
            <button onclick="proceedToDelivery()" class="modal-btn" style="background:var(--gold); color:black;">متابعة</button>
            <button onclick="closeModals()" style="background:none; border:none; color:gray; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <div id="choiceModal" class="order-modal">
        <div class="modal-card">
            <h3 style="color:var(--gold);">كيف تود استلام طلبك؟</h3>
            <a id="pickupBtn" onclick="finalizeOrder()" href="#" target="_blank" class="modal-btn" style="background:var(--gold); color:black;">استلام من المخبز (Pick up) 🛍️</a>
            <a id="deliveryBtn" onclick="finalizeOrder()" href="#" target="_blank" class="modal-btn" style="background:white; color:black;">توصيل (Delivery) 🚚</a>
        </div>
    </div>

    <div id="admin-modal" class="admin-modal">
        <button onclick="toggleAdminModal()" style="color:var(--gold); background:none; border:1px solid var(--gold); padding:8px; border-radius:5px; float:left;">✕ إغلاق</button>
        
        <div id="login-form">
            <h2>دخول الإدارة</h2>
            <input type="email" id="adminEmail" class="admin-input" placeholder="البريد الإلكتروني">
            <input type="password" id="adminPass" class="admin-input" placeholder="كلمة المرور">
            <button class="btn-gold" onclick="loginAdmin()">دخول</button>
        </div>

        <div id="admin-content" style="display:none;">
            <button onclick="logoutAdmin()" style="color:gray; background:none; border:none; cursor:pointer;">تسجيل خروج</button>
            <hr>
            <h3>إضافة قسم جديد</h3>
            <input type="text" id="catName" class="admin-input" placeholder="اسم القسم">
            <input type="file" id="catFile" class="admin-input">
            <button class="btn-gold" id="catBtn" onclick="uploadCategory()">حفظ القسم</button>
            <hr>
            <h3>إضافة صنف جديد</h3>
            <input type="text" id="itemNameAr" class="admin-input" placeholder="الاسم بالعربي">
            <input type="number" step="0.01" id="itemPrice" class="admin-input" placeholder="السعر">
            <select id="catSelect" class="admin-input"></select>
            <input type="file" id="itemFile" class="admin-input">
            <button class="btn-gold" id="itemBtn" onclick="uploadItem()">حفظ الصنف</button>
            <hr>
            <h3 style="color:var(--gold)">إدارة وحذف الأصناف</h3>
            <div id="admin-delete-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDVo1AFcUl9fLKYU97CcCoRdkCQEEQAPow", 
            authDomain: "grandbake-5689d.firebaseapp.com", 
            projectId: "grandbake-5689d", 
            storageBucket: "grandbake-5689d.firebasestorage.app", 
            messagingSenderId: "199046288157", 
            appId: "1:199046288157:web:5d0eca8fa42e2b9f8707f4" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const IMGBB_KEY = '55027fd2838aa7439244264aa3a5e785';

        let cart = {};
        let customerName = "";
        let deferredPrompt;

        // PWA System
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('install-notif').style.display = 'flex';
        });
        window.installApp = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-notif').style.display = 'none';
            }
        };
        window.closeNotif = () => document.getElementById('install-notif').style.display = 'none';

        // Auth Monitoring
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminTools();
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('admin-content').style.display = 'none';
            }
        });

        window.loginAdmin = async () => {
            const e = document.getElementById('adminEmail').value;
            const p = document.getElementById('adminPass').value;
            try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("بيانات الدخول غير صحيحة"); }
        };
        window.logoutAdmin = () => signOut(auth);

        // Data Sync (Customer View)
        onSnapshot(collection(db, "categories"), (snapshot) => {
            const container = document.getElementById('category-list');
            const select = document.getElementById('catSelect');
            container.innerHTML = ''; select.innerHTML = '';
            snapshot.forEach(catDoc => {
                const cat = catDoc.data();
                container.innerHTML += `<div class="top-menu-card" onclick="toggleSub('${catDoc.id}')"><img src="${cat.img}"><h2>${cat.name}</h2></div><div id="sub-${catDoc.id}" class="submenu"></div>`;
                select.innerHTML += `<option value="${catDoc.id}">${cat.name}</option>`;
            });
            onSnapshot(collection(db, "menu"), (itemSnap) => {
                document.querySelectorAll('.submenu').forEach(s => s.innerHTML = '');
                itemSnap.forEach(itemDoc => {
                    const item = itemDoc.data();
                    const sub = document.getElementById(`sub-${item.categoryId}`);
                    if(sub) {
                        sub.innerHTML += `<div class="menu-item"><img src="${item.img}" class="thumb"><div>${item.nameAr}<br><span style="color:var(--gold)">${item.price} JD</span></div><div class="qty-controls"><button class="qty-btn" onclick="changeQty('${itemDoc.id}', '${item.nameAr}', ${item.price}, -1)">-</button><span id="q-${itemDoc.id}">${cart[itemDoc.id]?.qty || 0}</span><button class="qty-btn" onclick="changeQty('${itemDoc.id}', '${item.nameAr}', ${item.price}, 1)">+</button></div></div>`;
                    }
                });
            });
        });

        // Admin Functionality
        async function uploadToImgBB(file) {
            const formData = new FormData(); formData.append('image', file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
            const data = await res.json(); return data.data.url;
        }

        window.uploadCategory = async () => {
            const name = document.getElementById('catName').value;
            const file = document.getElementById('catFile').files[0];
            if(!name || !file) return;
            const img = await uploadToImgBB(file);
            await addDoc(collection(db, "categories"), { name, img });
            alert("تم حفظ القسم");
        };

        window.uploadItem = async () => {
            const nameAr = document.getElementById('itemNameAr').value;
            const price = document.getElementById('itemPrice').value;
            const catId = document.getElementById('catSelect').value;
            const file = document.getElementById('itemFile').files[0];
            if(!nameAr || !price || !file) return alert("اكمل البيانات");
            const img = await uploadToImgBB(file);
            await addDoc(collection(db, "menu"), { nameAr, price: parseFloat(price), categoryId: catId, img });
            alert("تم حفظ الصنف");
        };

        function loadAdminTools() {
            onSnapshot(collection(db, "menu"), (snap) => {
                const list = document.getElementById('admin-delete-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    list.innerHTML += `<div style="display:flex; justify-content:space-between; margin:8px 0; background:#111; padding:10px; border-radius:10px;"><span>${d.data().nameAr}</span><button class="del-btn" onclick="delItem('${d.id}')">حذف</button></div>`;
                });
            });
        }

        window.delItem = async (id) => { if(confirm("حذف نهائي؟")) await deleteDoc(doc(db, "menu", id)); };

        // Cart Logic
        window.changeQty = (id, name, price, delta) => {
            if(!cart[id]) cart[id] = { name, price, qty: 0 };
            cart[id].qty = Math.max(0, cart[id].qty + delta);
            if(cart[id].qty === 0) delete cart[id];
            document.getElementById(`q-${id}`).innerText = cart[id]?.qty || 0;
            let total = 0; for(let k in cart) total += (cart[k].price * cart[k].qty);
            document.getElementById('cart-bar').style.display = total > 0 ? 'flex' : 'none';
            document.getElementById('cart-total').innerText = total.toFixed(2) + " JD";
        };

        window.toggleAdminModal = () => { const m = document.getElementById('admin-modal'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; };
        window.toggleSub = (id) => { const el = document.getElementById(`sub-${id}`); const vis = el.style.display === 'block'; document.querySelectorAll('.submenu').forEach(s => s.style.display = 'none'); el.style.display = vis ? 'none' : 'block'; };
        
        // Order Logic
        window.showNameModal = () => document.getElementById('nameModal').style.display = 'flex';
        window.closeModals = () => { document.getElementById('nameModal').style.display = 'none'; document.getElementById('choiceModal').style.display = 'none'; };
        window.proceedToDelivery = () => {
            customerName = document.getElementById('custName').value.trim();
            if(!customerName) return alert("الرجاء إدخال الاسم");
            document.getElementById('nameModal').style.display = 'none';
            document.getElementById('pickupBtn').href = createWA('استلام 🛍️');
            document.getElementById('deliveryBtn').href = createWA('توصيل 🚚');
            document.getElementById('choiceModal').style.display = 'flex';
        };

        function createWA(type) {
            let msg = `*طلب جديد من Grand Bakery*%0Aالاسم: ${customerName}%0Aالاستلام: ${type}%0A----------%0A`;
            let total = 0; for(let k in cart) { msg += `• ${cart[k].name} x${cart[k].qty}%0A`; total += (cart[k].price * cart[k].qty); }
            msg += `----------%0A*المجموع: ${total.toFixed(2)} JD*`;
            return `https://wa.me/962792089999?text=${msg}`;
        }

        window.finalizeOrder = () => { setTimeout(() => location.reload(), 1000); };
    </script>
</body>
</html>
