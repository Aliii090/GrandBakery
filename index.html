<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Bakery | جراند بيكري</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg); color: white; overflow-x: hidden; padding-bottom: 120px; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(8px) brightness(35%); z-index: -1; }
        
        /* Navigation */
        .top-bar {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1200px;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; z-index: 1000;
            border-radius: 0 0 20px 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.5); box-sizing: border-box;
        }
        .top-bar img { height: 50px; }
        
        /* Install Notification */
        #install-notif { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background: var(--gold); color: black; padding: 18px; border-radius: 20px; 
            display: none; flex-direction: column; gap: 12px; z-index: 2000; width: 290px; 
            text-align: center; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #install-notif button { background: black; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; }

        /* Menu Display */
        .container { margin-top: 120px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .top-menu-card {
            width: 320px; border-radius: 25px; overflow: hidden; cursor: pointer;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; flex-direction: column; align-items: center; padding: 12px; transition: 0.3s;
        }
        .top-menu-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 18px; }
        .top-menu-card h2 { margin: 12px 0; font-size: 1.5rem; color: var(--gold); }

        .submenu {
            display: none; max-width: 650px; width: 92%; margin: 10px auto; padding: 15px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .thumb { width: 65px; height: 65px; border-radius: 12px; object-fit: cover; border: 1px solid var(--gold); }
        .item-info { flex-grow: 1; }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: rgba(212, 175, 55, 0.2); border: 1px solid var(--gold); color: white; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; }

        /* Cart Bar */
        #cart-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #25D366; 
            color: white; padding: 18px; display: none; justify-content: space-around; 
            align-items: center; z-index: 2001; font-weight: bold; cursor: pointer;
        }

        /* Contact Section */
        .contact-section { text-align: center; padding: 40px 0; margin-top: 50px; border-top: 1px solid rgba(212, 175, 55, 0.3); background: rgba(0,0,0,0.4); }
        .contact-phones a { color: white; text-decoration: none; font-size: 1.2rem; border: 1px solid var(--gold); padding: 8px 20px; border-radius: 12px; display: inline-block; background: rgba(212, 175, 55, 0.1); margin: 5px; }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .social-icons img { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--gold); }

        /* Admin Styles */
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .admin-input { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px; }
        .btn-gold { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;}
        .del-btn { background: #ff4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div id="install-notif">
        <span>تثبيت الموقع على الشاشة الرئيسية</span>
        <button onclick="installApp()">تثبيت الآن</button>
        <button onclick="closeNotif()" style="background:none; color:black; font-size: 0.8rem;">إغلاق</button>
    </div>

    <video autoplay muted loop playsinline><source src="grandvideo.mp4" type="video/mp4"></video>

    <div class="top-bar">
        <img src="logogrand.png" alt="Grand Bakery">
        <button onclick="toggleAdmin()" style="background:none; border:none; font-size: 22px; cursor: pointer;">⚙️</button>
    </div>

    <div class="container" id="category-list"></div>

    <div class="contact-section">
        <h2 style="color:var(--gold);">تواصل معنا</h2>
        <div class="contact-phones">
            <a href="tel:0797475002">0797475002</a>
            <a href="tel:0792089999">0792089999</a>
        </div>
        <div class="social-icons">
            <a href="https://www.instagram.com/grandbakeryjo" target="_blank"><img src="Instagram.jpg"></a>
            <a href="https://goo.gl/maps/XYZ" target="_blank"><img src="googlemapsembed.jpg"></a>
        </div>
    </div>

    <div id="cart-bar" onclick="sendOrder()">
        <span>إرسال الطلب عبر الواتساب</span>
        <span id="cart-total">0.00 JD</span>
    </div>

    <div id="admin-modal" class="admin-modal">
        <button onclick="toggleAdmin()" style="color:var(--gold); background:none; border:1px solid var(--gold); padding:8px; border-radius:5px;">✕ إغلاق</button>
        <div id="login-form">
            <h2>دخول الإدارة</h2>
            <input type="password" id="adminPass" class="admin-input" placeholder="كلمة المرور">
            <button class="btn-gold" onclick="loginAdmin()">دخول</button>
        </div>
        <div id="admin-content" style="display:none;">
            <h3>إضافة قسم (Category)</h3>
            <input type="text" id="catName" class="admin-input" placeholder="اسم القسم">
            <input type="file" id="catFile" class="admin-input" accept="image/*">
            <button class="btn-gold" id="catBtn" onclick="uploadCategory()">حفظ القسم</button>
            <hr style="border:1px solid #222; margin:20px 0;">
            <h3>إضافة صنف (Item)</h3>
            <input type="text" id="nameAr" class="admin-input" placeholder="الاسم بالعربي">
            <input type="number" step="0.01" id="price" class="admin-input" placeholder="السعر">
            <select id="catSelect" class="admin-input"></select>
            <input type="file" id="itemFile" class="admin-input" accept="image/*">
            <button class="btn-gold" id="itemBtn" onclick="uploadItem()">حفظ الصنف</button>
            <hr style="border:1px solid #222; margin:20px 0;">
            <h3>إدارة المحتوى (حذف)</h3>
            <div id="admin-delete-list"></div>
        </div>
    </div>
<div id="choiceModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; justify-content:center; align-items:center;">
    <div style="background:white; padding:30px; border-radius:15px; text-align:center; max-width:90%; width:400px;">
        <h3 style="color:#d4af37; margin-bottom:20px;">How would you like your order?</h3>
        
        <button onclick="finalizeOrder('Pickup 🛍️')" style="width:100%; padding:15px; margin-bottom:10px; background:#d4af37; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
            I will Pick it up
        </button>
        
        <button onclick="finalizeOrder('Delivery 🚚')" style="width:100%; padding:15px; background:#333; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
            Deliver to me
        </button>
        
        <button onclick="closeChoiceModal()" style="margin-top:15px; background:none; border:none; color:gray; text-decoration:underline; cursor:pointer;">
            Cancel
        </button>
    </div>
</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVo1AFcUl9fLKYU97CcCoRdkCQEEQAPow",
            authDomain: "grandbake-5689d.firebaseapp.com",
            projectId: "grandbake-5689d",
            storageBucket: "grandbake-5689d.firebasestorage.app",
            messagingSenderId: "199046288157",
            appId: "1:199046288157:web:5d0eca8fa42e2b9f8707f4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_KEY = '55027fd2838aa7439244264aa3a5e785';

        let cart = {};
        let deferredPrompt;

        // --- PWA Install Logic ---
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('install-notif').style.display = 'flex';
        });
        window.installApp = async () => {
            if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
            else { alert("استخدم قائمة المتصفح -> إضافة للشاشة الرئيسية"); }
        };
        window.closeNotif = () => document.getElementById('install-notif').style.display = 'none';

        // --- Magic Image Upload ---
        async function uploadToImgBB(file) {
    const formData = new FormData();
    formData.append('image', file);
    
    // We use a try-catch block here to catch network issues
    try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { 
            method: 'POST',
            body: formData 
        });
        
        const result = await response.json();

        if (result.success) {
            return result.data.url; // Success: return the link
        } else {
            // ImgBB received the request but rejected the image
            throw new Error("ImgBB Rejected: " + result.error.message);
        }
    } catch (error) {
        // Network failed or server is down
        throw new Error("Network Error: " + error.message);
    }
}


        // --- Data Sync ---
        onSnapshot(collection(db, "categories"), (snapshot) => {
            const container = document.getElementById('category-list');
            const select = document.getElementById('catSelect');
            const delList = document.getElementById('admin-delete-list');
            container.innerHTML = ''; select.innerHTML = ''; delList.innerHTML = '<h4>الأقسام:</h4>';
            
            snapshot.forEach(catDoc => {
                const cat = catDoc.data();
                container.innerHTML += `<div class="top-menu-card" onclick="toggleSub('${catDoc.id}')"><img src="${cat.img}"><h2>${cat.name}</h2></div><div id="sub-${catDoc.id}" class="submenu"></div>`;
                select.innerHTML += `<option value="${catDoc.id}">${cat.name}</option>`;
                delList.innerHTML += `<div style="display:flex; justify-content:space-between; margin:8px 0;"><span>📁 ${cat.name}</span><button class="del-btn" onclick="deleteRecord('categories','${catDoc.id}')">حذف القسم</button></div>`;
            });

            onSnapshot(collection(db, "menu"), (itemSnap) => {
                document.querySelectorAll('.submenu').forEach(s => s.innerHTML = '');
                delList.innerHTML += '<h4 style="margin-top:20px;">الأصناف:</h4>';
                itemSnap.forEach(itemDoc => {
                    const item = itemDoc.data();
                    const sub = document.getElementById(`sub-${item.categoryId}`);
                    if(sub) {
                        sub.innerHTML += `<div class="menu-item"><img src="${item.img}" class="thumb"><div class="item-info"><div>${item.nameAr}</div><div style="color:var(--gold)">${item.price} JD</div></div><div class="qty-controls"><button class="qty-btn" onclick="changeQty('${itemDoc.id}', '${item.nameAr}', ${item.price}, -1)">-</button><span id="q-${itemDoc.id}">${cart[itemDoc.id]?.qty || 0}</span><button class="qty-btn" onclick="changeQty('${itemDoc.id}', '${item.nameAr}', ${item.price}, 1)">+</button></div></div>`;
                    }
                    delList.innerHTML += `<div style="display:flex; justify-content:space-between; margin:5px 0;"><small>🍞 ${item.nameAr}</small><button class="del-btn" onclick="deleteRecord('menu','${itemDoc.id}')">حذف الصنف</button></div>`;
                });
            });
        });

        // --- Admin Functions ---
        window.uploadCategory = async () => {
    // 1. Get input values
    const nameInput = document.getElementById('catName');
    const fileInput = document.getElementById('catFile');
    const btn = document.getElementById('catBtn');
    
    const name = nameInput.value;
    const file = fileInput.files[0];

    // 2. Validation
    if (!name || !file) {
        return alert("Please enter a name and select an image.");
    }

    // 3. UI Feedback (Disable button)
    btn.innerText = "Processing...";
    btn.disabled = true;

    try {
        // 4. Run the upload engine
        const imageUrl = await uploadToImgBB(file);
        
        // 5. Save to Firestore
        await addDoc(collection(db, "categories"), { 
            name: name, 
            img: imageUrl 
        });

        // 6. Success
        alert("Category added successfully!");
        nameInput.value = '';
        fileInput.value = '';

    } catch (err) {
        // 7. Error Handling
        console.error("Full Error Trace:", err);
        alert("Failed: " + err.message);
    } finally {
        // 8. Reset UI
        btn.innerText = "Save Category";
        btn.disabled = false;
    }
};


        window.uploadItem = async () => {
            const nameAr = document.getElementById('nameAr').value;
            const price = document.getElementById('price').value;
            const categoryId = document.getElementById('catSelect').value;
            const file = document.getElementById('itemFile').files[0];
            const btn = document.getElementById('itemBtn');
            if(!nameAr || !price || !file) return alert("اكمل البيانات");
            btn.innerText = "جاري الرفع..."; btn.disabled = true;
            try {
                const img = await uploadToImgBB(file);
                await addDoc(collection(db, "menu"), { nameAr, price: parseFloat(price), categoryId, img });
                alert("تم الحفظ");
                document.getElementById('nameAr').value = ''; document.getElementById('price').value = '';
            } catch(e) { alert("خطأ في الرفع"); }
            btn.innerText = "حفظ الصنف"; btn.disabled = false;
        };

        // --- App Utilities ---
        window.deleteRecord = async (coll, id) => { if(confirm("هل أنت متأكد من الحذف النهائي؟")) await deleteDoc(doc(db, coll, id)); };
        window.toggleAdmin = () => { const m = document.getElementById('admin-modal'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; };
import { getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

window.loginAdmin = async () => {
    const enteredPass = document.getElementById('adminPass').value;
    const btn = document.querySelector('#login-form .btn-gold');
    
    btn.innerText = "Checking...";
    
    try {
        // Fetch the password from the "settings" collection
        const adminDoc = await getDoc(doc(db, "settings", "admin"));
        
        if (adminDoc.exists()) {
            const correctPass = adminDoc.data().password;
            
            if (enteredPass === correctPass) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else {
                alert("Wrong password!");
            }
        } else {
            alert("Error: Password not set in database.");
        }
    } catch (e) {
        console.error(e);
        alert("Permission denied. Check your Firestore Rules!");
    } finally {
        btn.innerText = "Login";
    }
};
        window.toggleSub = (id) => { 
            const el = document.getElementById(`sub-${id}`); 
            const vis = el.style.display === 'block'; 
            document.querySelectorAll('.submenu').forEach(s => s.style.display = 'none'); 
            el.style.display = vis ? 'none' : 'block'; 
            if(!vis) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };
        window.changeQty = (id, name, price, delta) => {
            if(!cart[id]) cart[id] = { name, price, qty: 0 };
            cart[id].qty = Math.max(0, cart[id].qty + delta);
            if(cart[id].qty === 0) delete cart[id];
            const qSpan = document.getElementById(`q-${id}`);
            if(qSpan) qSpan.innerText = cart[id]?.qty || 0;
            let total = 0; for(let k in cart) total += (cart[k].price * cart[k].qty);
            document.getElementById('cart-bar').style.display = total > 0 ? 'flex' : 'none';
            document.getElementById('cart-total').innerText = total.toFixed(2) + " JD";
        };
        // Step 1: Open the choice modal instead of sending immediately
window.sendOrder = () => {
    if (cart.length === 0) return alert("Your cart is empty!");
    document.getElementById('choiceModal').style.display = 'flex';
};

window.closeChoiceModal = () => {
    document.getElementById('choiceModal').style.display = 'none';
};

// Step 2: Finalize and send to WhatsApp
window.finalizeOrder = (method) => {
    let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    
    // Header with the chosen method
    let msg = `*NEW ORDER - ${method}*\n`;
    msg += `--------------------------\n`;
    
    // Items list
    cart.forEach(item => {
        msg += `• ${item.name} (x${item.quantity}) - ${item.price * item.quantity} JOD\n`;
    });
    
    msg += `--------------------------\n`;
    msg += `*Total: ${total} JOD*`;

    // Send to your WhatsApp number
    const phone = "962XXXXXXXXX"; // Change to your bakery's number
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
    
    // Cleanup
    closeChoiceModal();
    cart = [];
    updateCart();
    toggleCart();
};

    </script>
</body>
</html>
