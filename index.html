<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Bakery - Admin Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ALL YOUR ORIGINAL STYLES REMAIN HERE */
  body { margin: 0; font-family: 'Cormorant Garamond', serif; color: white; background: black; direction: rtl; overflow-x: hidden; padding-bottom: 120px; }
  video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(8px) brightness(35%); z-index: -1; }
  .top-bar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); max-width: 1200px; width: 95%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; z-index: 1000; border-radius: 0 0 20px 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.5); }
  .top-menu-container { display: flex; flex-direction: column; align-items: center; margin: 120px 0 30px 0; gap: 25px; }
  .top-menu-card { width: 320px; height: 200px; border-radius: 25px; overflow: hidden; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); display: flex; flex-direction: column; align-items: center; padding: 12px; }
  .top-menu-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 18px; }
  .submenu { display: none; max-width: 650px; width: 92%; margin: 0 auto 40px auto; padding: 20px; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(20px); border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
  .menu-items li { list-style: none; margin: 20px 0; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 15px; }
  .thumb { width: 65px; height: 65px; object-fit: cover; border-radius: 12px; border: 1px solid #D4AF37; }
  #cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #25D366; color: white; padding: 18px; display: none; justify-content: space-around; align-items: center; z-index: 2001; font-weight: bold; cursor: pointer; }
  
  /* NEW ADMIN STYLES */
  #admin-trigger { color: #333; font-size: 10px; text-align: center; margin-top: 50px; cursor: pointer; }
  #admin-panel { display: none; position: fixed; top: 10%; left: 5%; width: 90%; height: 80%; background: #111; border: 2px solid #D4AF37; z-index: 5000; border-radius: 20px; padding: 20px; overflow-y: auto; color: white; }
  .admin-input { width: 90%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; }
</style>
</head>
<body>

<div class="top-bar">
  <img src="logogrand.png" alt="Grand Bakery" style="height:50px;">
  <button onclick="toggleLang()" style="background:#D4AF37; border:none; padding:8px 18px; border-radius:10px; font-weight:bold;">EN</button>
</div>

<div class="top-menu-container">
  <div class="top-menu-card" onclick="toggleSubmenu('manakish-sub')"><img src="menu2.jpg"><h2>المناقيش</h2></div>
  <div class="top-menu-card" onclick="toggleSubmenu('pastries-sub')"><img src="menu1.jpg"><h2>المعجنات</h2></div>
  <div class="top-menu-card" onclick="toggleSubmenu('pizza-sub')"><img src="pizza.jpg"><h2>البيتزا</h2></div>
</div>

<div class="submenu" id="manakish-sub"><ul class="menu-items"></ul></div>
<div class="submenu" id="pastries-sub"><ul class="menu-items"></ul></div>
<div class="submenu" id="pizza-sub"><ul class="menu-items"></ul></div>

<div id="cart-bar" onclick="sendOrder()">
    <span id="cart-text">إرسال الطلب عبر الواتساب</span>
    <span id="cart-total">0.00 JD</span>
</div>

<div id="admin-trigger" onclick="showLogin()">Admin Area</div>
<div id="admin-panel">
    <button onclick="document.getElementById('admin-panel').style.display='none'">X Close</button>
    <div id="login-form">
        <h3>Login</h3>
        <input type="text" id="adminUser" class="admin-input" placeholder="grandbakery">
        <input type="password" id="adminPass" class="admin-input" placeholder="password">
        <button onclick="loginAdmin()" style="background:#D4AF37; padding:10px; width:100%;">Login</button>
    </div>
    <div id="admin-controls" style="display:none;">
        <h3>Add New Item</h3>
        <input type="text" id="newAr" class="admin-input" placeholder="الاسم بالعربي">
        <input type="text" id="newEn" class="admin-input" placeholder="Name in English">
        <input type="number" id="newPrice" class="admin-input" placeholder="Price">
        <select id="newCat" class="admin-input">
            <option value="manakish-sub">مناقيش</option>
            <option value="pastries-sub">معجنات</option>
            <option value="pizza-sub">بيتزا</option>
        </select>
        <button onclick="saveToFirebase()" style="background:#D4AF37; padding:10px; width:100%;">SAVE TO CLOUD</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDVo1AFcUl9fLKYU97CcCoRdkCQEEQAPow",
    authDomain: "grandbake-5689d.firebaseapp.com",
    projectId: "grandbake-5689d",
    storageBucket: "grandbake-5689d.firebasestorage.app",
    messagingSenderId: "199046288157",
    appId: "1:199046288157:web:5d0eca8fa42e2b9f8707f4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. Load Data
  onSnapshot(collection(db, "menu"), (snapshot) => {
    document.querySelectorAll('.menu-items').forEach(ul => ul.innerHTML = '');
    snapshot.forEach((doc) => {
      const item = doc.data();
      const id = doc.id;
      const list = document.getElementById(item.category)?.querySelector('.menu-items');
      if(list) {
          list.innerHTML += `
            <li data-id="${id}">
                <img src="m1.jpg" class="thumb">
                <div class="item-info">
                    <span class="item-name" data-ar="${item.nameAr}" data-en="${item.nameEn}">${item.nameAr}</span>
                    <span><span class="price">${item.price}</span> JD</span>
                </div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="changeQty('${id}', 1)">+</button>
                    <span class="qty-val" id="q-${id}">0</span>
                </div>
            </li>`;
      }
    });
  });

  // 2. Admin Functions
  window.saveToFirebase = async () => {
    const data = {
        nameAr: document.getElementById('newAr').value,
        nameEn: document.getElementById('newEn').value,
        price: document.getElementById('newPrice').value,
        category: document.getElementById('newCat').value
    };
    await addDoc(collection(db, "menu"), data);
    alert("Saved!");
  };

  window.loginAdmin = () => {
      if(document.getElementById('adminUser').value === 'grandbakery' && 
         document.getElementById('adminPass').value === '@admin5567') {
          document.getElementById('login-form').style.display = 'none';
          document.getElementById('admin-controls').style.display = 'block';
      } else { alert("Wrong!"); }
  };
</script>

<script>
  // YOUR ORIGINAL APP LOGIC (Cart, toggleSubmenu, etc)
  function toggleSubmenu(id) {
    const target = document.getElementById(id);
    document.querySelectorAll('.submenu').forEach(s => { if(s.id !== id) s.style.display = 'none'; });
    target.style.display = target.style.display === 'block' ? 'none' : 'block';
  }
  function showLogin() { document.getElementById('admin-panel').style.display = 'block'; }
  // ... other original functions ...
</script>

</body>
</html>
