<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Bakery | جراند بيكري</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg); color: white; overflow-x: hidden; padding-bottom: 120px; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(2px) brightness(35%); z-index: -1; }
        
        .top-bar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1200px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; z-index: 1000; border-radius: 0 0 20px 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.5); box-sizing: border-box; }
        .top-bar img { height: 50px; }
        
        #install-notif { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--gold); color: black; padding: 18px; border-radius: 20px; display: none; flex-direction: column; gap: 12px; z-index: 2000; width: 290px; text-align: center; font-weight: bold; }
        #install-notif button { background: black; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; }

        .container { margin-top: 120px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .top-menu-card { width: 320px; border-radius: 25px; overflow: hidden; cursor: pointer; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); display: flex; flex-direction: column; align-items: center; padding: 12px; }
        .top-menu-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 18px; }
        
        .submenu { display: none; max-width: 650px; width: 92%; margin: 10px auto; padding: 15px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .qty-btn { background: var(--gold); border: none; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        #cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #25D366; color: white; padding: 18px; display: none; justify-content: space-around; z-index: 2001; font-weight: bold; cursor: pointer; }

        .contact-section { text-align: center; padding: 40px 0; margin-top: 50px; border-top: 1px solid rgba(212, 175, 55, 0.3); }
        .contact-phones a { color: white; text-decoration: none; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 10px; margin: 5px; display: inline-block; }
        .social-icons img { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--gold); margin: 0 10px; }

        .order-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; justify-content:center; align-items:center; }
        .modal-card { background: #111; padding: 30px; border-radius: 25px; border: 1px solid var(--gold); text-align: center; width: 90%; max-width: 400px; }
        .admin-input { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; }
        .btn-gold { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }

        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .admin-section { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="install-notif">
        <span>تثبيت الموقع على الشاشة؟</span>
        <button onclick="installApp()">تثبيت</button>
        <button onclick="closeNotif()" style="background:none;">إغلاق</button>
    </div>

    <video autoplay muted loop playsinline><source src="grandvideo.mp4" type="video/mp4"></video>

    <div class="top-bar">
        <img src="logogrand.png" alt="Grand Bakery">
        <button onclick="checkAdmin()" style="background:none; border:none; font-size: 22px; cursor:pointer;">⚙️</button>
    </div>

    <div class="container" id="category-list"></div>

    <div class="contact-section">
        <h2 style="color:var(--gold);">تواصل معنا</h2>
        <div class="contact-phones">
            <a href="tel:0797475002">0797475002</a>
            <a href="tel:0792089999">0792089999</a>
        </div>
        <div class="social-icons">
            <a href="https://www.instagram.com/grandbakeryjo" target="_blank"><img src="Instagram.jpg"></a>
            <a href="https://maps.app.goo.gl/YourLink" target="_blank"><img src="googlemapsembed.jpg"></a>
        </div>
    </div>

    <div id="cart-bar" onclick="showNameModal()">
        <span>إرسال الطلب (واتساب)</span>
        <span id="cart-total">0.00 JD</span>
    </div>

    <div id="nameModal" class="order-modal">
        <div class="modal-card">
            <h3>الاسم للطلب</h3>
            <input type="text" id="custName" class="admin-input" placeholder="الاسم الكامل">
            <button onclick="proceedToChoice()" class="btn-gold">متابعة</button>
        </div>
    </div>

    <div id="choiceModal" class="order-modal">
        <div class="modal-card">
            <h3>نوع الطلب</h3>
            <button onclick="finalizeOrder('استلام 🛍️')" class="btn-gold">استلام (Pick up)</button>
            <button onclick="finalizeOrder('توصيل 🚚')" class="btn-gold" style="background:white;">توصيل (Delivery)</button>
        </div>
    </div>

    <div id="admin-modal" class="admin-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--gold);">لوحة التحكم</h2>
            <button onclick="closeAdmin()" style="background:none; color:red; border:1px solid red; padding:5px; border-radius:5px;">إغلاق</button>
        </div>

        <div class="admin-section">
            <h3>إضافة قسم جديد</h3>
            <input type="text" id="newCatName" class="admin-input" placeholder="اسم القسم (مثلاً: خبز)">
            <input type="file" id="newCatFile" class="admin-input">
            <button onclick="uploadCategory()" id="catBtn" class="btn-gold">حفظ القسم</button>
        </div>

        <div class="admin-section">
            <h3>إضافة صنف جديد</h3>
            <input type="text" id="newItemName" class="admin-input" placeholder="اسم الصنف بالعربي">
            <input type="number" step="0.01" id="newItemPrice" class="admin-input" placeholder="السعر">
            <select id="catSelect" class="admin-input"></select>
            <input type="file" id="newItemFile" class="admin-input">
            <button onclick="uploadItem()" id="itemBtn" class="btn-gold">حفظ الصنف</button>
        </div>

        <div class="admin-section">
            <h3>إدارة المحتوى (حذف)</h3>
            <div id="admin-delete-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDVo1AFcUl9fLKYU97CcCoRdkCQEEQAPow", 
            authDomain: "grandbake-5689d.firebaseapp.com", 
            projectId: "grandbake-5689d", 
            storageBucket: "grandbake-5689d.firebasestorage.app", 
            messagingSenderId: "199046288157", 
            appId: "1:199046288157:web:5d0eca8fa42e2b9f8707f4" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_KEY = '55027fd2838aa7439244264aa3a5e785';

        let cart = {}, customerName = "", isAdmin = false, deferredPrompt;

        // Admin Auth
        window.checkAdmin = async () => {
            if(isAdmin) { document.getElementById('admin-modal').style.display='block'; return; }
            const p = prompt("كلمة المرور:");
            const snap = await getDoc(doc(db, "settings", "admin"));
            if(snap.exists() && p === snap.data().password) {
                isAdmin = true;
                document.getElementById('admin-modal').style.display='block';
                loadAdminTools();
            } else { alert("خطأ!"); }
        };
        window.closeAdmin = () => document.getElementById('admin-modal').style.display='none';

        // Load Data
        onSnapshot(collection(db, "categories"), (snap) => {
            const list = document.getElementById('category-list');
            const select = document.getElementById('catSelect');
            list.innerHTML = ''; select.innerHTML = '';
            snap.forEach(d => {
                const c = d.data();
                list.innerHTML += `<div class="top-menu-card" onclick="toggleSub('${d.id}')"><img src="${c.img}"><h2>${c.name}</h2></div><div id="sub-${d.id}" class="submenu"></div>`;
                select.innerHTML += `<option value="${d.id}">${c.name}</option>`;
            });
            onSnapshot(collection(db, "menu"), (mSnap) => {
                document.querySelectorAll('.submenu').forEach(s => s.innerHTML = '');
                mSnap.forEach(md => {
                    const m = md.data();
                    const target = document.getElementById(`sub-${m.categoryId}`);
                    if(target) target.innerHTML += `<div class="menu-item"><div><img src="${m.img}" style="width:50px;height:50px;border-radius:8px;vertical-align:middle;margin-left:10px;"><b>${m.nameAr}</b><br>${m.price} JD</div><div><button class="qty-btn" onclick="changeQty('${md.id}','${m.nameAr}',${m.price},1)">+</button> <span id="q-${md.id}">${cart[md.id]?.qty || 0}</span> <button class="qty-btn" onclick="changeQty('${md.id}','${m.nameAr}',${m.price},-1)">-</button></div></div>`;
                });
            });
        });

        // Admin Functions
        async function upImg(file) {
            const fd = new FormData(); fd.append('image', file);
            const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
            const d = await r.json(); return d.data.url;
        }

        window.uploadCategory = async () => {
            const n = document.getElementById('newCatName').value;
            const f = document.getElementById('newCatFile').files[0];
            if(!n || !f) return alert("اكمل البيانات");
            document.getElementById('catBtn').innerText = "جاري الحفظ...";
            const url = await upImg(f);
            await addDoc(collection(db, "categories"), { name: n, img: url });
            alert("تم الحفظ");
            location.reload();
        };

        window.uploadItem = async () => {
            const n = document.getElementById('newItemName').value;
            const p = document.getElementById('newItemPrice').value;
            const c = document.getElementById('catSelect').value;
            const f = document.getElementById('newItemFile').files[0];
            if(!n || !p || !f) return alert("اكمل البيانات");
            document.getElementById('itemBtn').innerText = "جاري الحفظ...";
            const url = await upImg(f);
            await addDoc(collection(db, "menu"), { nameAr: n, price: parseFloat(p), categoryId: c, img: url });
            alert("تم الحفظ");
            location.reload();
        };

        function loadAdminTools() {
            const delList = document.getElementById('admin-delete-list');
            onSnapshot(collection(db, "categories"), s => {
                delList.innerHTML = '<h4>الأقسام:</h4>';
                s.forEach(d => delList.innerHTML += `<div style="display:flex;justify-content:space-between;padding:5px;">${d.data().name} <button onclick="delDoc('categories','${d.id}')" style="color:red;">حذف</button></div>`);
                onSnapshot(collection(db, "menu"), ms => {
                    delList.innerHTML += '<h4 style="margin-top:20px;">الأصناف:</h4>';
                    ms.forEach(d => delList.innerHTML += `<div style="display:flex;justify-content:space-between;padding:5px;">${d.data().nameAr} <button onclick="delDoc('menu','${d.id}')" style="color:red;">حذف</button></div>`);
                });
            });
        }
        window.delDoc = async (col, id) => { if(confirm("حذف نهائي؟")) await deleteDoc(doc(db, col, id)); };

        // Cart & Order
        window.changeQty = (id, name, price, delta) => {
            if(!cart[id]) cart[id] = { name, price, qty: 0 };
            cart[id].qty = Math.max(0, cart[id].qty + delta);
            if(cart[id].qty === 0) delete cart[id];
            document.getElementById(`q-${id}`).innerText = cart[id]?.qty || 0;
            let total = 0; for(let k in cart) total += (cart[k].price * cart[k].qty);
            document.getElementById('cart-bar').style.display = total > 0 ? 'flex' : 'none';
            document.getElementById('cart-total').innerText = total.toFixed(2) + " JD";
        };

        window.showNameModal = () => document.getElementById('nameModal').style.display='flex';
        window.proceedToChoice = () => { customerName = document.getElementById('custName').value; if(customerName) { document.getElementById('nameModal').style.display='none'; document.getElementById('choiceModal').style.display='flex'; } };
        
        window.finalizeOrder = (type) => {
            let m = `*طلب جديد*%0Aالاسم: ${customerName}%0Aالنوع: ${type}%0A----------%0A`;
            let t = 0; for(let k in cart) { m += `• ${cart[k].name} (x${cart[k].qty})%0A`; t += (cart[k].price * cart[k].qty); }
            m += `----------%0A*المجموع: ${t.toFixed(2)} JD*`;
            window.open(`https://wa.me/962792089999?text=${m}`);
            location.reload();
        };

        window.toggleSub = (id) => { const el = document.getElementById(`sub-${id}`); const cur = el.style.display === 'block'; document.querySelectorAll('.submenu').forEach(s => s.style.display='none'); el.style.display = cur ? 'none' : 'block'; };
        
        // PWA
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; document.getElementById('install-notif').style.display='flex'; });
        window.installApp = () => { deferredPrompt.prompt(); document.getElementById('install-notif').style.display='none'; };
        window.closeNotif = () => document.getElementById('install-notif').style.display='none';
    </script>
</body>
</html>
