<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Bakery | جراند بيكري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card-bg: rgba(255,255,255,0.05); }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg); color: white; overflow-x: hidden; padding-bottom: 120px; }
        
        /* Layout */
        .header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 15px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); }
        .container { margin-top: 100px; padding: 15px; }

        /* Category Cards */
        .cat-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .cat-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.3); text-align: center; cursor: pointer; transition: 0.3s; }
        .cat-card:active { transform: scale(0.98); }
        .cat-card img { width: 100%; height: 180px; object-fit: cover; }
        .cat-card h2 { margin: 10px 0; font-size: 1.5rem; color: var(--gold); }

        /* Menu Items */
        .submenu { display: none; margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 15px; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .item-img { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; border: 1px solid var(--gold); }
        .item-info { flex-grow: 1; }
        .price { color: var(--gold); font-weight: bold; }

        /* Quantity Buttons */
        .qty-btn { background: var(--gold); border: none; width: 30px; height: 30px; border-radius: 5px; font-weight: bold; color: black; }

        /* Cart Bar */
        #cart-bar { position: fixed; bottom: 80px; left: 5%; width: 90%; background: #25D366; padding: 15px; display: none; justify-content: space-between; border-radius: 50px; z-index: 2000; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* Contact Section */
        .contact-footer { padding: 30px 15px; text-align: center; background: #0a0a0a; border-top: 1px solid #222; margin-top: 40px; }
        .contact-icons { display: flex; justify-content: center; gap: 25px; margin-top: 15px; }
        .contact-icons img { width: 35px; height: 35px; transition: 0.3s; }

        /* Admin Dashboard */
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 20px; overflow-y: auto; }
        .admin-input { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; }
        .btn-gold { background: var(--gold); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logogrand.png" style="height: 45px;" alt="Logo">
        <button onclick="toggleAdmin()" style="background:none; border:none; font-size: 20px;">⚙️</button>
    </div>

    <div class="container">
        <div id="category-list" class="cat-grid">
            </div>
    </div>

    <div class="contact-footer">
        <h3>تواصل معنا | Contact Us</h3>
        <div class="contact-icons">
            <a href="tel:+9627XXXXXXXX"><img src="phone.png" alt="Phone"></a>
            <a href="https://instagram.com/grandbakery"><img src="insta.png" alt="Instagram"></a>
            <a href="https://wa.me/9627XXXXXXXX"><img src="whatsapp.png" alt="WhatsApp"></a>
            <a href="https://goo.gl/maps/XYZ"><img src="location.png" alt="Location"></a>
        </div>
    </div>

    <div id="cart-bar" onclick="sendWhatsApp()">
        <span>🛒 إرسال الطلب عبر واتساب</span>
        <span id="cart-total">0.00 JD</span>
    </div>

    <div id="admin-modal" class="admin-modal">
        <button onclick="toggleAdmin()" style="color:var(--gold); margin-bottom: 20px;">✕ إغلاق</button>
        
        <div id="login-form">
            <h2>دخول الإدارة</h2>
            <input type="password" id="adminPass" class="admin-input" placeholder="كلمة المرور">
            <button class="btn-gold" onclick="loginAdmin()">دخول</button>
        </div>

        <div id="admin-content" style="display:none;">
            <h3>إضافة صنف جديد</h3>
            <input type="text" id="nameAr" class="admin-input" placeholder="الاسم بالعربي">
            <input type="text" id="nameEn" class="admin-input" placeholder="Name in English">
            <input type="number" id="price" class="admin-input" placeholder="السعر (مثال: 0.75)">
            <select id="catSelect" class="admin-input">
                <option value="manakish-sub">مناقيش</option>
                <option value="pastries-sub">معجنات</option>
                <option value="pizza-sub">بيتزا</option>
            </select>
            <input type="file" id="imgFile" class="admin-input" accept="image/*">
            <button class="btn-gold" id="uploadBtn" onclick="uploadItem()">حفظ الصنف</button>
            <hr style="border: 0.5px solid #222; margin: 30px 0;">
            <h3>الأصناف الحالية</h3>
            <div id="edit-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVo1AFcUl9fLKYU97CcCoRdkCQEEQAPow",
            authDomain: "grandbake-5689d.firebaseapp.com",
            projectId: "grandbake-5689d",
            storageBucket: "grandbake-5689d.firebasestorage.app",
            messagingSenderId: "199046288157",
            appId: "1:199046288157:web:5d0eca8fa42e2b9f8707f4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let cart = {};

        // Load Menu Data
        onSnapshot(collection(db, "menu"), (snapshot) => {
            const categories = [
                { id: "manakish-sub", name: "المناقيش", img: "menu2.jpg" },
                { id: "pastries-sub", name: "المعجنات", img: "menu1.jpg" },
                { id: "pizza-sub", name: "البيتزا", img: "pizza.jpg" }
            ];

            const listDiv = document.getElementById('category-list');
            const adminList = document.getElementById('edit-list');
            listDiv.innerHTML = '';
            adminList.innerHTML = '';

            categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'cat-card';
                card.innerHTML = `
                    <img src="${cat.img}">
                    <h2>${cat.name}</h2>
                    <div id="${cat.id}" class="submenu"></div>
                `;
                card.onclick = (e) => {
                    const sub = card.querySelector('.submenu');
                    sub.style.display = sub.style.display === 'block' ? 'none' : 'block';
                };
                listDiv.appendChild(card);
            });

            snapshot.forEach(docSnap => {
                const item = docSnap.data();
                const id = docSnap.id;
                const targetSub = document.getElementById(item.category);
                
                if(targetSub) {
                    targetSub.innerHTML += `
                        <div class="menu-item" onclick="event.stopPropagation()">
                            <img src="${item.img || 'm1.jpg'}" class="item-img">
                            <div class="item-info">
                                <div>${item.nameAr}</div>
                                <div class="price">${item.price} JD</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px">
                                <button class="qty-btn" onclick="window.updateQty('${id}', '${item.nameAr}', ${item.price}, -1)">-</button>
                                <span id="qty-${id}">0</span>
                                <button class="qty-btn" onclick="window.updateQty('${id}', '${item.nameAr}', ${item.price}, 1)">+</button>
                            </div>
                        </div>
                    `;
                }

                adminList.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:#111; margin-bottom:5px; border-radius:8px;">
                        <span>${item.nameAr}</span>
                        <button onclick="window.removeItem('${id}')" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px;">حذف</button>
                    </div>
                `;
            });
        });

        // Cart Logic
        window.updateQty = (id, name, price, delta) => {
            if(!cart[id]) cart[id] = { name, price, qty: 0 };
            cart[id].qty += delta;
            if(cart[id].qty <= 0) {
                cart[id].qty = 0;
                delete cart[id];
            }
            const qtyLabel = document.getElementById(`qty-${id}`);
            if(qtyLabel) qtyLabel.innerText = cart[id]?.qty || 0;
            updateCartUI();
        }

        function updateCartUI() {
            let total = 0;
            for(let key in cart) total += (cart[key].price * cart[key].qty);
            document.getElementById('cart-bar').style.display = total > 0 ? 'flex' : 'none';
            document.getElementById('cart-total').innerText = total.toFixed(2) + " JD";
        }

        window.sendWhatsApp = () => {
            let text = "طلب جديد من جراند بيكري:%0A------------------%0A";
            for(let key in cart) {
                text += `• ${cart[key].name} (العدد: ${cart[key].qty})%0A`;
            }
            window.open(`https://wa.me/9627XXXXXXXX?text=${text}`);
        }

        // Admin Auth
        window.loginAdmin = () => {
            if(document.getElementById('adminPass').value === '@admin5567') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else { alert("كلمة المرور خاطئة"); }
        }

        window.uploadItem = async () => {
            const btn = document.getElementById('uploadBtn');
            const file = document.getElementById('imgFile').files[0];
            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            let url = "";
            if(file) {
                const sRef = ref(storage, `items/${Date.now()}_${file.name}`);
                await uploadBytes(sRef, file);
                url = await getDownloadURL(sRef);
            }

            await addDoc(collection(db, "menu"), {
                nameAr: document.getElementById('nameAr').value,
                nameEn: document.getElementById('nameEn').value,
                price: document.getElementById('price').value,
                category: document.getElementById('catSelect').value,
                img: url || "m1.jpg"
            });

            btn.innerText = "حفظ الصنف";
            btn.disabled = false;
            alert("تمت الإضافة!");
        }

        window.removeItem = async (id) => {
            if(confirm("هل أنت متأكد من الحذف؟")) await deleteDoc(doc(db, "menu", id));
        }

        window.toggleAdmin = () => {
            const m = document.getElementById('admin-modal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
